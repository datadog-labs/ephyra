name: Regressions
# Every fixed bug is re-injected (regressions/<id>/injection.patch) and its class
# properties must catch it; on the clean tree they all pass. regressions/README.md.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  regressions:
    name: Re-injected bugs are caught
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      # Pull requests: each entry against its own oracles. Nightly: the full matrix,
      # every oracle against every injection, which shows the properties that catch
      # more than the bug they were written for.
      - if: github.event_name != 'schedule'
        run: python3 regressions/run.py
      - if: github.event_name == 'schedule'
        run: python3 regressions/run.py --matrix --json regressions-matrix.json
