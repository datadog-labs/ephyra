[package]
name = "ephyra-macros"
description = "Derive and attribute macros for ephyra (use through the `ephyra` crate)"
version = "0.2.0"
edition = "2024"
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
include = ["src/**", "Cargo.toml", "LICENSE"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }

[lints.rust]
missing_docs = "warn"
