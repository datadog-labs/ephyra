[package]
name = "ephyra-datadog"
description = "Send ephyra's test cases to Datadog: case counts, feature and timing distributions over DogStatsD, events for failed runs, and sampled inputs as logs"
version = "0.2.0"
edition = "2024"
categories = ["development-tools::testing"]
keywords = ["property-testing", "pbt", "datadog", "dogstatsd", "observability"]
readme = "README.md"
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[features]
# The `ephyra-datadog` binary, which lays out and uploads the dashboard.
cli = ["dep:ureq"]

[dependencies]
ephyra = { version = "=0.2.0", path = "../ephyra", default-features = false }
serde_json = "1.0"
ureq = { version = "3", optional = true, features = ["json"] }

[[bin]]
name = "ephyra-datadog"
required-features = ["cli"]

[lints.rust]
missing_docs = "warn"
