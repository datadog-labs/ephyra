[package]
name = "ephyra"
description = "Property-based testing built for coding agents: verified generators, shrinkers and mutators, seed replay, targeted and coverage-guided search, in-process coverage with fault localization, and testing loops written by hand"
version = "0.0.1"
edition = "2024"
categories = ["development-tools::testing"]
keywords = ["property-testing", "pbt", "quickcheck", "shrinking", "fuzzing"]
readme = "README.md"
repository.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE"]

[package.metadata.docs.rs]
features = ["coverage"]

[features]
default = ["json", "derive"]
# JSON reports, config files and the regressions file (serde + serde_json).
json = ["dep:serde", "dep:serde_json"]
# `#[derive(Arbitrary)]`, `#[ephyra::shrinker]`, and `#[ephyra::test]`.
derive = ["dep:ephyra-macros"]
# In-process LLVM coverage counters (needs `-C instrument-coverage` on the
# final build; detected by the build script). Implies `json`, which the
# targets file and the coverage grid need.
coverage = ["dep:rustc-demangle", "dep:miniz_oxide", "dep:object", "json"]
# Assume the build is instrumented even when the build script cannot see
# the flag (profile rustflags, `cargo rustc -- ...`).
coverage-force = ["coverage"]

[dependencies]
rustc-demangle = { version = "0.1", optional = true }
miniz_oxide = { version = "0.9", optional = true }
object = { version = "0.40", optional = true, default-features = false, features = ["read", "std"] }
ephyra-macros = { version = "=0.0.1", path = "../ephyra-macros", optional = true }
rand_core = "0.9"
rand_chacha = "0.9"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
insta = { version = "1.48", features = ["filters"] }
serde_json = "1.0"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
