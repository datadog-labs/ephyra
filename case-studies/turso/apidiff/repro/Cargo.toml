[package]
name = "apidiff-repro"
version = "0.0.0"
edition = "2021"
publish = false
description = "Standalone reproductions of turso-apidiff findings: each binary runs one API sequence on Turso (turso crate) and on SQLite 3.50.4 (rusqlite)"

[dependencies]
turso = { path = "../../../../turso/bindings/rust", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
pollster = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[workspace]

[patch.crates-io]
libsqlite3-sys = { path = "../../../sqlite/vendor/libsqlite3-sys-3.50.4" }
