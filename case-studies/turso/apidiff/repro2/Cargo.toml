[package]
name = "turso-apidiff-repro2"
version = "0.0.0"
edition = "2021"
publish = false
description = "Round-2 repros: a minimal writable native virtual table on turso_core (main)"

[dependencies]
turso_core = { path = "../../../../turso/core", default-features = false, features = ["baseline"] }
turso_sqlite = { path = "../../../../turso/sqlite/frontend" }
turso_ext = { path = "../../../../turso/extensions/core", features = ["core_only"] }
# issue_*.rs bins: turso crate (Turso side) and rusqlite (SQLite 3.50.4 side)
turso = { path = "../../../../turso/bindings/rust", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["rt", "macros"] }
# issue_vtab_*.rs bins load ../vtab-ext (a turso_ext cdylib that uses mimalloc, as
# extensions/core/README.md requires): same allocator and version as tursodb
mimalloc = { version = "=0.1.47", default-features = false }

[workspace]

[profile.release]
debug = 1

[patch.crates-io]
libsqlite3-sys = { path = "../../../sqlite/vendor/libsqlite3-sys-3.50.4" }
