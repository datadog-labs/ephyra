[package]
name = "ephyra-sqlite"
version = "0.0.0"
edition = "2021"
publish = false
description = "A predicate for valid SQLite database files, and metrics of them, for ephyra generator synthesis"

[dependencies]
# The ephyra checkout, two directories up.
ephyra = { path = "../../crates/ephyra" }
# SQLite, bundled: the judge of what a valid database file is. The bundled
# amalgamation is SQLite trunk, not a release (see the patch below).
rusqlite = { version = "0.37", features = ["bundled", "serialize", "hooks"] }

[workspace]

# libsqlite3-sys with SQLite trunk (bfe473ab, 2026-10-13) in place of its
# 3.50.2: bugs found are then ones trunk still has. Made by ../vendor/fetch.sh,
# which must run first.
[patch.crates-io]
libsqlite3-sys = { path = "../vendor/libsqlite3-sys-trunk" }


# Generation, shrinking and the predicate are compute-bound, and `ephyra check`
# builds the debug profile: optimize it, at about twice the build time.
[profile.dev]
opt-level = 2
