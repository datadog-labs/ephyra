[package]
name = "ephyra-ada"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
ephyra = { path = "../../crates/ephyra" }
url = "2.5"
serde_json = "1"
regex = "1"
# Its punycode encoder, for ACE labels in the grammar.
idna = "1"
# Deno's URLPattern, a second reference.
urlpattern = "0.6"

[dev-dependencies]
unicode-bidi = "0.3"
percent-encoding = "2"


[build-dependencies]
cc = "1"

[workspace]

# Generation, the shim and ada are compute-bound, and `ephyra check` builds
# the debug profile: optimize it.
[profile.dev]
opt-level = 2
