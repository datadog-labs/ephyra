[package]
name = "ephyra-postgresql"
version = "0.0.0"
edition = "2021"
publish = false
description = "Model-checked statements and SQLancer-style oracles for PostgreSQL, for ephyra generator synthesis"

[dependencies]
# The ephyra checkout, two directories up.
ephyra = { path = "../../../crates/ephyra" }
# The client. The server is PostgreSQL master built with assertions, its
# binaries in EPHYRA_PG_BIN (see `pg`), not a crate.
postgres = "0.19"

[features]
# In-process coverage of this crate's generators and harness (for `ephyra
# test` and `ephyra visualize` pages), not of the PostgreSQL server: that is
# ../coverage.
coverage = ["ephyra/coverage"]

[workspace]

# Generation, shrinking and the predicate are compute-bound, and `ephyra check`
# builds the debug profile: optimize it, at about twice the build time.
[profile.dev]
opt-level = 2
